name: Cyberful release

on:
  workflow_dispatch:

concurrency:
  group: cyberful-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Validate branch, version, and tag
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Cyberful releases must be dispatched from main" >&2
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-cyberful\.[0-9]+$ ]]; then
            echo "Unexpected Cyberful release version: $VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu.2.28
            binary: agent-browser-linux-x64
            use_zigbuild: true
          - name: Linux ARM64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-gnu.2.28
            binary: agent-browser-linux-arm64
            use_zigbuild: true
          - name: Linux musl x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            build_target: x86_64-unknown-linux-musl
            binary: agent-browser-linux-musl-x64
            use_zigbuild: true
          - name: Linux musl ARM64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            build_target: aarch64-unknown-linux-musl
            binary: agent-browser-linux-musl-arm64
            use_zigbuild: true
          - name: Windows x64
            os: ubuntu-latest
            rust_target: x86_64-pc-windows-gnu
            build_target: x86_64-pc-windows-gnu
            binary: agent-browser-win32-x64.exe
            use_zigbuild: false
          - name: macOS x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            build_target: x86_64-apple-darwin
            binary: agent-browser-darwin-x64
            use_zigbuild: false
          - name: macOS ARM64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            binary: agent-browser-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize native version
        run: pnpm run version:sync

      - name: Build embedded dashboard
        run: pnpm --filter dashboard build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Windows cross-compiler
        if: matrix.rust_target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --version 0.22.3 --locked

      - name: Configure Windows linker
        if: matrix.rust_target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target ${{ matrix.build_target }}

      - name: Build with cargo
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "${{ matrix.rust_target }}" == *windows* ]]; then
            cp "cli/target/${{ matrix.rust_target }}/release/agent-browser.exe" "artifacts/${{ matrix.binary }}"
          else
            cp "cli/target/${{ matrix.rust_target }}/release/agent-browser" "artifacts/${{ matrix.binary }}"
            chmod +x "artifacts/${{ matrix.binary }}"
          fi
          test -s "artifacts/${{ matrix.binary }}"

      - name: Verify Linux GNU glibc floor
        if: matrix.binary == 'agent-browser-linux-x64' || matrix.binary == 'agent-browser-linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          if objdump -p "artifacts/${{ matrix.binary }}" | grep -E 'GLIBC_2\.([3-9][0-9]|29)'; then
            echo "${{ matrix.binary }} requires glibc newer than 2.28" >&2
            exit 1
          fi

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.binary }}
          path: artifacts/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [metadata, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: bin
          merge-multiple: true

      - name: Verify and package release
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          BINARIES=(
            agent-browser-linux-x64
            agent-browser-linux-arm64
            agent-browser-linux-musl-x64
            agent-browser-linux-musl-arm64
            agent-browser-win32-x64.exe
            agent-browser-darwin-x64
            agent-browser-darwin-arm64
          )
          for binary in "${BINARIES[@]}"; do
            test -s "bin/$binary"
          done
          chmod +x bin/agent-browser-linux-* bin/agent-browser-darwin-*

          node scripts/check-version-sync.js
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          ARCHIVE="release/agent-browser-${VERSION}.tgz"
          test -s "$ARCHIVE"
          tar -tzf "$ARCHIVE" > release/manifest.txt

          for binary in "${BINARIES[@]}"; do
            grep -Fxq "package/bin/$binary" release/manifest.txt
          done
          grep -Fxq package/skill-data/core/SKILL.md release/manifest.txt
          grep -Fxq package/skills/agent-browser/SKILL.md release/manifest.txt
          grep -Fxq package/LICENSE release/manifest.txt

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > release/notes.md
          test -s release/notes.md

      - name: Create immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "agent-browser $VERSION" \
            --notes-file release/notes.md \
            --prerelease \
            --latest=false \
            release/agent-browser-${VERSION}.tgz \
            bin/agent-browser-linux-x64 \
            bin/agent-browser-linux-arm64 \
            bin/agent-browser-linux-musl-x64 \
            bin/agent-browser-linux-musl-arm64 \
            bin/agent-browser-win32-x64.exe \
            bin/agent-browser-darwin-x64 \
            bin/agent-browser-darwin-arm64
